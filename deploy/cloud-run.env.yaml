# Environment variables for the Cloud Run service "mahakal-api".
# Used by .github/workflows/deploy.yml (gcloud run deploy --env-vars-file).
# No secrets here: GROQ_API_KEY, GEMINI_API_KEY, GOOGLE_CLIENT_ID and SESSION_SECRET are read from
# Secret Manager at startup because SECRETS_SOURCE is "secret-manager". PORT is set by Cloud Run.

SECRETS_SOURCE: secret-manager
GOOGLE_CLOUD_PROJECT: mahakal-ai-230925
STORAGE_BACKEND: firestore

GROQ_MODEL: openai/gpt-oss-120b
GEMINI_MODEL: gemini-flash-latest
TTS_VOICE: en-IN-PrabhatNeural

GUEST_MESSAGE_LIMIT: "5"

COOKIE_SECURE: "true"
CORS_ORIGINS: https://mahakal-ai.web.app
