name: Deploy

# Runs after CI passes on main (i.e. after a PR is merged), or manually from the Actions tab.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: asia-south1
  SERVICE: mahakal-api
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Deploy to Google Cloud
    # Only main is deployed. Google enforces this too: the Workload Identity provider only issues
    # credentials to workflows running on refs/heads/main of this repository.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}

      # Keyless auth: GitHub's OIDC token is exchanged for short-lived Google credentials.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the API image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/mahakal/api:${COMMIT}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy the API to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "mahakal-run@${PROJECT_ID}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 40 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 60 \
            --env-vars-file deploy/cloud-run.env.yaml \
            --quiet

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy the frontend to Firebase Hosting
        run: npx --yes firebase-tools@15.34.0 deploy --only hosting --project "$PROJECT_ID" --non-interactive

      - name: Smoke test
        run: |
          curl --fail --silent --show-error https://mahakal-ai.web.app/mahakal/api/v1/health
